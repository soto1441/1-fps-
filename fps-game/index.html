<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>1FPS</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
    canvas { display: block; }

    #hud {
      position: fixed; inset: 0; pointer-events: none; color: #ddd;
      text-shadow: 0 0 4px #000;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 22px; height: 22px;
      transform: translate(-50%, -50%);
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #d6ffb0;
      box-shadow: 0 0 3px rgba(0,0,0,.8);
    }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
    #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }
    #crosshair.shoot { filter: brightness(2.2); }

    #bottomLeft {
      position: absolute; left: 24px; bottom: 20px; text-align: left;
    }
    #weaponName {
      font-size: 15px; letter-spacing: 2px; color: #9aa; margin-bottom: 2px;
    }
    #ammoLine { font-size: 28px; font-weight: bold; letter-spacing: 1px; }
    #ammoLine span { color: #9be86b; }

    #bottomRight {
      position: absolute; right: 24px; bottom: 20px; text-align: right; width: 220px;
    }
    #hpLine { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    #hpLine span { color: #ff5d5d; }
    #healthbar {
      width: 100%; height: 14px; border: 2px solid rgba(255,255,255,.5);
      background: rgba(0,0,0,.4); box-shadow: 0 0 4px rgba(0,0,0,.8);
    }
    #healthbarFill {
      height: 100%; width: 100%; background: linear-gradient(90deg,#ff5d5d,#ff9d5d);
      transition: width .15s;
    }

    #weaponSwitchHint {
      position: absolute; left: 24px; bottom: 70px; font-size: 12px; color: #889;
    }

    #hitmarker {
      position: absolute; top: 50%; left: 50%; width: 28px; height: 28px;
      transform: translate(-50%, -50%); opacity: 0; transition: opacity .08s;
    }
    #hitmarker::before, #hitmarker::after { content: ''; position: absolute; background: #fff; }
    #hitmarker::before { width: 100%; height: 2px; top: 50%; transform: translateY(-50%) rotate(45deg); }
    #hitmarker::after  { width: 100%; height: 2px; top: 50%; transform: translateY(-50%) rotate(-45deg); }
    #hitmarker.show { opacity: 1; }

    #flash {
      position: fixed; inset: 0; background: #ff0000; opacity: 0; pointer-events: none;
      transition: opacity .15s;
    }
    #flash.show { opacity: .25; }

    #killfeed {
      position: absolute; top: 16px; right: 16px; font-size: 14px; color: #ffce5c; text-align: right;
    }

    #blocker {
      position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex;
      align-items: center; justify-content: center; flex-direction: column; color: #eee; cursor: pointer;
      z-index: 10;
    }
    #blocker h1 { font-size: 38px; letter-spacing: 4px; color: #9be86b; margin-bottom: 6px; }
    #blocker p { font-size: 14px; color: #aaa; margin: 4px 0; }
    #blocker.hidden { display: none; }

    #mapSelect { display: flex; gap: 10px; margin-top: 18px; cursor: default; }
    .mapBtn {
      padding: 8px 16px; font-family: inherit; font-size: 13px; letter-spacing: 1px;
      color: #cdd; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25);
      border-radius: 4px; cursor: pointer;
    }
    .mapBtn:hover { background: rgba(255,255,255,.16); }
    .mapBtn.active { background: #9be86b; color: #14210a; border-color: #9be86b; font-weight: bold; }
  </style>
</head>
<body>
  <div id="blocker">
    <h1 id="blockerTitle">1FPS</h1>
    <p id="blockerSub">클릭해서 게임 시작 (마우스 잠금)</p>
    <p>WASD 이동 · Shift 스프린트 · Space 점프 · 좌클릭 공격 · R 재장전 · 1~5 무기교체</p>
    <div id="mapSelect">
      <button class="mapBtn" data-map="urban">도심 폐허</button>
      <button class="mapBtn" data-map="desert">사막 협곡</button>
      <button class="mapBtn" data-map="snow">설상 기지</button>
      <button class="mapBtn" data-map="arena">아레나</button>
      <button class="mapBtn" data-map="backrooms">백룸</button>
      <button class="mapBtn" data-map="onyx">오닉스</button>
    </div>
  </div>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="hitmarker"></div>
    <div id="bottomLeft">
      <div id="weaponName">RIFLE</div>
      <div id="ammoLine">AMMO <span id="ammo">12</span>/<span id="reserve">48</span></div>
    </div>
    <div id="weaponSwitchHint">1 라이플 · 2 권총 · 3 칼 · 4 샷건 · 5 스나이퍼</div>
    <div id="bottomRight">
      <div id="hpLine">HP <span id="hp">150</span>/150</div>
      <div id="healthbar"><div id="healthbarFill"></div></div>
    </div>
    <div id="killfeedList"></div>
  </div>
  <div id="flash"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
