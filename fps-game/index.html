<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>1FPS</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
    canvas { display: block; }

    #hud {
      position: fixed; inset: 0; pointer-events: none; color: #ddd;
      text-shadow: 0 0 4px #000;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 22px; height: 22px;
      transform: translate(-50%, -50%);
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #d6ffb0;
      box-shadow: 0 0 3px rgba(0,0,0,.8);
    }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
    #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }
    #crosshair.shoot { filter: brightness(2.2); }
    #crosshair.zoomed { display: none; }

    #scopeOverlay {
      position: fixed; top: 50%; left: 50%; width: 0; height: 0;
      transform: translate(-50%, -50%); border-radius: 50%;
      box-shadow: 0 0 0 9999px #000;
      opacity: 0; pointer-events: none; transition: opacity .08s;
    }
    #scopeOverlay.show { opacity: 1; width: 480px; height: 480px; }
    #scopeOverlay::before, #scopeOverlay::after {
      content: ''; position: absolute; background: #000;
    }
    #scopeOverlay::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
    #scopeOverlay::after  { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }
    #scopeDot {
      position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
      transform: translate(-50%, -50%); background: #d6ffb0; border-radius: 50%;
    }
    #scopeRing {
      position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid #000; box-shadow: 0 0 18px 6px rgba(0,0,0,.6) inset;
    }

    #bottomLeft {
      position: absolute; left: 24px; bottom: 20px; text-align: left;
    }
    #weaponName {
      font-size: 15px; letter-spacing: 2px; color: #9aa; margin-bottom: 2px;
    }
    #ammoLine { font-size: 28px; font-weight: bold; letter-spacing: 1px; }
    #ammoLine span { color: #9be86b; }

    #bottomRight {
      position: absolute; right: 24px; bottom: 20px; text-align: right; width: 220px;
    }
    #hpLine { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    #hpLine span { color: #ff5d5d; }
    #healthbar {
      width: 100%; height: 14px; border: 2px solid rgba(255,255,255,.5);
      background: rgba(0,0,0,.4); box-shadow: 0 0 4px rgba(0,0,0,.8);
    }
    #healthbarFill {
      height: 100%; width: 100%; background: linear-gradient(90deg,#ff5d5d,#ff9d5d);
      transition: width .15s;
    }
    #armorLine { font-size: 13px; color: #7fb8e0; margin-top: 4px; }
    #armorLine span { color: #bfe3ff; font-weight: bold; }
    #armorLine.hidden { display: none; }
    #creditsLine { font-size: 13px; color: #ffce5c; margin-top: 4px; }
    #creditsLine span { color: #ffe39a; font-weight: bold; }
    #creditsLine.hidden { display: none; }

    #weaponSwitchHint {
      position: absolute; left: 24px; bottom: 70px; font-size: 12px; color: #889;
    }

    #hitmarker {
      position: absolute; top: 50%; left: 50%; width: 28px; height: 28px;
      transform: translate(-50%, -50%); opacity: 0; transition: opacity .08s;
    }
    #hitmarker::before, #hitmarker::after { content: ''; position: absolute; background: #fff; }
    #hitmarker::before { width: 100%; height: 2px; top: 50%; transform: translateY(-50%) rotate(45deg); }
    #hitmarker::after  { width: 100%; height: 2px; top: 50%; transform: translateY(-50%) rotate(-45deg); }
    #hitmarker.show { opacity: 1; }

    #flash {
      position: fixed; inset: 0; background: #ff0000; opacity: 0; pointer-events: none;
      transition: opacity .15s;
    }
    #flash.show { opacity: .25; }

    #killfeed {
      position: absolute; top: 16px; right: 16px; font-size: 14px; color: #ffce5c; text-align: right;
    }

    #killBanner {
      position: absolute; top: 0; left: 0; width: 100%; height: 50px;
      background: rgba(0,0,0,.55); color: #fff; font-size: 20px; font-weight: bold;
      letter-spacing: 2px; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .25s;
    }
    #killBanner.show { opacity: 1; }

    #roundLine {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      font-size: 16px; letter-spacing: 2px; color: #d6ffb0; text-shadow: 0 0 4px #000;
    }

    #blocker {
      position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex;
      align-items: center; justify-content: center; flex-direction: column; color: #eee; cursor: pointer;
      z-index: 10;
    }
    #blocker h1 { font-size: 38px; letter-spacing: 4px; color: #9be86b; margin-bottom: 6px; }
    #blocker p { font-size: 14px; color: #aaa; margin: 4px 0; }
    #blocker.hidden { display: none; }

    #modeSelect { display: flex; gap: 10px; margin-top: 14px; cursor: default; }
    #mapSelect { display: flex; gap: 10px; margin-top: 10px; cursor: default; }
    .mapBtn, .modeBtn {
      padding: 8px 16px; font-family: inherit; font-size: 13px; letter-spacing: 1px;
      color: #cdd; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25);
      border-radius: 4px; cursor: pointer;
    }
    .mapBtn:hover, .modeBtn:hover { background: rgba(255,255,255,.16); }
    .mapBtn.active, .modeBtn.active { background: #9be86b; color: #14210a; border-color: #9be86b; font-weight: bold; }

    #buyMenu {
      position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #eee;
    }
    #buyMenu.hidden { display: none; }
    .buyMenuInner {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
      max-width: 1100px; max-height: 80vh; overflow-y: auto;
    }
    .buyCol {
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px; padding: 8px; min-width: 108px; text-align: center;
    }
    .buyCol h3 { font-size: 12px; color: #9be86b; margin: 0 0 8px; letter-spacing: 1px; }
    .buyBtn {
      display: block; width: 100%; padding: 7px 6px; margin-bottom: 6px;
      font-family: inherit; font-size: 12px; color: #cdd; background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.25); border-radius: 4px; cursor: pointer;
    }
    .buyBtn:hover { background: rgba(255,255,255,.18); }
    .buyBtn.active { background: #9be86b; color: #14210a; font-weight: bold; border-color: #9be86b; }
    .buyHint { margin-top: 16px; font-size: 12px; color: #889; }
    #buyCreditsLine { font-size: 14px; color: #ffce5c; margin-bottom: 14px; letter-spacing: 1px; }
    #buyCreditsLine span { color: #ffe39a; font-weight: bold; }
    .buyCost { display: block; font-size: 11px; color: #ffce5c; margin-top: 2px; }
    .buyBtn.unaffordable { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="blocker">
    <h1 id="blockerTitle">1FPS</h1>
    <p id="blockerSub">클릭해서 게임 시작 (마우스 잠금)</p>
    <p>WASD 이동 · Shift 스프린트 · Space 점프 · 좌클릭 공격 · R 재장전 · 1 주무기(순환) · 2 보조무기 · 3 근접무기 · B 무기 변경 · 스나이퍼 우클릭 줌 · V 무기 살펴보기</p>
    <div id="modeSelect">
      <button class="modeBtn" data-mode="range">사격장</button>
      <button class="modeBtn" data-mode="duel">1대1 AI 대결</button>
    </div>
    <div id="mapSelect">
      <button class="mapBtn" data-map="urban">도심 폐허</button>
      <button class="mapBtn" data-map="desert">사막 협곡</button>
      <button class="mapBtn" data-map="snow">설상 기지</button>
      <button class="mapBtn" data-map="arena">아레나</button>
      <button class="mapBtn" data-map="backrooms">백룸</button>
      <button class="mapBtn" data-map="onyx">오닉스</button>
    </div>
  </div>

  <div id="hud">
    <div id="killBanner"></div>
    <div id="roundLine">ROUND 0/5</div>
    <div id="crosshair"></div>
    <div id="scopeOverlay"><div id="scopeRing"></div><div id="scopeDot"></div></div>
    <div id="hitmarker"></div>
    <div id="bottomLeft">
      <div id="weaponName">RIFLE</div>
      <div id="ammoLine">AMMO <span id="ammo">12</span>/<span id="reserve">48</span></div>
    </div>
    <div id="weaponSwitchHint">1 주무기(순환) · 2 사이드암(순환) · 3 근접무기 · B 구매창</div>
    <div id="bottomRight">
      <div id="hpLine">HP <span id="hp">150</span>/150</div>
      <div id="healthbar"><div id="healthbarFill"></div></div>
      <div id="armorLine" class="hidden">방어구 <span id="armor">0</span></div>
      <div id="creditsLine" class="hidden">크레딧 <span id="credits">800</span></div>
    </div>
    <div id="killfeedList"></div>
  </div>
  <div id="flash"></div>

  <div id="buyMenu" class="hidden">
    <p id="buyCreditsLine">보유 크레딧 <span id="buyCredits">800</span></p>
    <div class="buyMenuInner">
      <div class="buyCol">
        <h3>사이드암</h3>
        <button class="buyBtn" data-weapon="classic">클래식 <span class="buyCost">0</span></button>
        <button class="buyBtn" data-weapon="shorty">쇼티 <span class="buyCost">0</span></button>
        <button class="buyBtn" data-weapon="frenzy">프렌지 <span class="buyCost">0</span></button>
        <button class="buyBtn" data-weapon="ghost">고스트 <span class="buyCost">0</span></button>
        <button class="buyBtn" data-weapon="sheriff">쉐리프 <span class="buyCost">0</span></button>
      </div>
      <div class="buyCol">
        <h3>SMG</h3>
        <button class="buyBtn" data-weapon="stinger">스팅어 <span class="buyCost">0</span></button>
        <button class="buyBtn" data-weapon="spectre">스펙터 <span class="buyCost">0</span></button>
      </div>
      <div class="buyCol">
        <h3>샷건</h3>
        <button class="buyBtn" data-weapon="bucky">버키 <span class="buyCost">0</span></button>
        <button class="buyBtn" data-weapon="judge">저지 <span class="buyCost">0</span></button>
      </div>
      <div class="buyCol">
        <h3>라이플</h3>
        <button class="buyBtn" data-weapon="bulldog">불도그 <span class="buyCost">0</span></button>
        <button class="buyBtn" data-weapon="guardian">가디언 <span class="buyCost">0</span></button>
        <button class="buyBtn" data-weapon="phantom">팬텀 <span class="buyCost">0</span></button>
        <button class="buyBtn" data-weapon="vandal">반달 <span class="buyCost">0</span></button>
      </div>
      <div class="buyCol">
        <h3>저격소총</h3>
        <button class="buyBtn" data-weapon="marshal">마샬 <span class="buyCost">0</span></button>
        <button class="buyBtn" data-weapon="outlaw">아웃로 <span class="buyCost">0</span></button>
        <button class="buyBtn" data-weapon="operator">오퍼레이터 <span class="buyCost">0</span></button>
      </div>
      <div class="buyCol">
        <h3>중화기</h3>
        <button class="buyBtn" data-weapon="ares">에레스 <span class="buyCost">0</span></button>
        <button class="buyBtn" data-weapon="odin">오딘 <span class="buyCost">0</span></button>
      </div>
      <div class="buyCol">
        <h3>근접무기</h3>
        <button class="buyBtn" data-weapon="knife">나이프 <span class="buyCost">0</span></button>
      </div>
      <div class="buyCol">
        <h3>방어구</h3>
        <button class="buyBtn" data-armor="light">경량 방어구 <span class="buyCost">0</span></button>
        <button class="buyBtn" data-armor="heavy">중량 방어구 <span class="buyCost">0</span></button>
      </div>
    </div>
    <p class="buyHint">B 키로 닫기</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
